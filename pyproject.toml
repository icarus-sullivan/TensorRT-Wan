[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorrt-wan"
version = "0.1.0"
description = "TensorRT acceleration framework for Wan video generation models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TensorRT-Wan Contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "onnx>=1.16",
    "onnxscript>=0.1",
]

[project.optional-dependencies]
tensorrt = ["tensorrt>=10.0", "onnxruntime-gpu>=1.18", "polygraphy>=0.49"]
comfyui = ["torch>=2.3"]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "black>=24.0"]

[project.scripts]
trtwan = "tensorrt_wan.cli.main:main"

[project.urls]
Homepage = "https://github.com/tensorrt-wan/tensorrt-wan"
Documentation = "https://github.com/tensorrt-wan/tensorrt-wan/tree/main/docs"

[tool.setuptools.packages.find]
include = ["tensorrt_wan*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
