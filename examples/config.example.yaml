# Example TensorRT-Wan configuration. Copy to config.yaml and pass --config, or load with
# tensorrt_wan.config.load_config(). Every field is optional; omitted fields use schema defaults
# (see tensorrt_wan/config/schema.py).

precision:
  mode: auto        # auto | fp8 | fp16 | bf16 | fp32
  allow_fp8: true
  allow_bf16: true

cache:
  enabled: true
  directory: ~/.cache/tensorrt_wan/engines
  max_size_gb: null

engine_paths:
  engine_dir: ~/.cache/tensorrt_wan/engines
  onnx_dir: ~/.cache/tensorrt_wan/onnx

resolution_profiles:
  - name: 480x832
    height: 480
    width: 832
  - name: 720x1280
    height: 720
    width: 1280

plugins:
  enabled:
    CustomAttention: true
    FusedActivation: true

attention:
  implementation: auto   # auto | flash | flash2 | flash3 | sage | torch_sdpa

memory:
  workspace_limit_mb: null
  memory_pool_limit_mb: null

log_level: INFO
